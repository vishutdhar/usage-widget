name: UsageWidget
options:
  bundleIdPrefix: com.vishutdhar
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
settings:
  base:
    # replace with your own Apple team id (and in the App Group ids below,
    # both entitlements files and SharedContainer.swift)
    DEVELOPMENT_TEAM: DABJS94K9F
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    ENABLE_HARDENED_RUNTIME: YES
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
packages:
  UsageKit:
    path: Packages/UsageKit
targets:
  UsageWidget:
    type: application
    platform: macOS
    sources:
      - App
      # The agent's launchd job, registered with SMAppService.agent.
      - path: LaunchAgent/com.vishutdhar.usagewidget.agent.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchAgents
    dependencies:
      - package: UsageKit
        product: UsageCore
      - package: UsageKit
        product: UsageAgentCore
      - target: UsageWidgetExtension
        embed: true
        codeSign: true
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Usage Widget
        CFBundleDisplayName: Usage Widget
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
    entitlements:
      path: App/UsageWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - DABJS94K9F.com.vishutdhar.usagewidget  # your team id first
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishutdhar.usagewidget
        PRODUCT_NAME: Usage Widget
        PRODUCT_MODULE_NAME: UsageWidgetApp
        ENABLE_APP_SANDBOX: NO
  UsageWidgetExtension:
    type: app-extension
    platform: macOS
    sources: [Widget]
    dependencies:
      - package: UsageKit
        product: UsageCore
      - package: UsageKit
        product: UsageWidgetUI
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widget/Info.plist
      properties:
        CFBundleName: UsageWidgetExtension
        CFBundleDisplayName: Usage
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/UsageWidgetExtension.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.application-groups:
          - DABJS94K9F.com.vishutdhar.usagewidget  # your team id first
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.vishutdhar.usagewidget.widget
        PRODUCT_NAME: UsageWidgetExtension
        ENABLE_APP_SANDBOX: YES
        SKIP_INSTALL: YES
schemes:
  UsageWidget:
    build:
      targets:
        UsageWidget: all
        UsageWidgetExtension: all
    run:
      config: Debug
    archive:
      config: Release
